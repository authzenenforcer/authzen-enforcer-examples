# Keycloak as the AuthZEN Policy Decision Point (PDP) for all examples, and the identity provider
# that issues the callers' tokens.
#
#   export DOCUMENT_PORTAL_CLIENT_SECRET=$(openssl rand -hex 24)
#   export EXAMPLE_USER_PASSWORD=$(openssl rand -hex 24)
#   docker compose up --wait
#
# The realm file contains no secrets; Keycloak reads the client secret and the users' password from
# the environment when it imports the realm.
#
# KEYCLOAK_ADDRESS and KEYCLOAK_PORT set where Keycloak is published (default 127.0.0.1:8080). The
# images stay literals so that Dependabot can update them.
#
# Cerbos is a second PDP for the Spring examples, off by default. It starts with the profile cerbos,
# next to Keycloak, which still issues the tokens:
#
#   docker compose --profile cerbos up --wait
#
# CERBOS_ADDRESS and CERBOS_PORT set where its HTTP API is published (default 127.0.0.1:3592).
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--features=authzen", "--import-realm", "--health-enabled=true"]
    environment:
      DOCUMENT_PORTAL_CLIENT_SECRET: ${DOCUMENT_PORTAL_CLIENT_SECRET:?set DOCUMENT_PORTAL_CLIENT_SECRET}
      EXAMPLE_USER_PASSWORD: ${EXAMPLE_USER_PASSWORD:?set EXAMPLE_USER_PASSWORD}
      # Optional: an administrator for the admin console, created at the first start only. Without
      # a value here, Compose passes these on only when they are set where it runs
      KC_BOOTSTRAP_ADMIN_USERNAME:
      KC_BOOTSTRAP_ADMIN_PASSWORD:
    ports:
      - "${KEYCLOAK_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/authzen-examples-realm.json:/opt/keycloak/data/import/authzen-examples-realm.json:ro
    healthcheck:
      # The image has no curl; bash talks to the management port directly.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.58.0
    profiles: ["cerbos"]
    # Cerbos reads the policies in /policies and needs no setting for its AuthZEN API. In this
    # configuration it does not authenticate the PEPs that call it, so it is published on this
    # machine only
    ports:
      - "${CERBOS_ADDRESS:-127.0.0.1}:${CERBOS_PORT:-3592}:3592"
    volumes:
      - ./cerbos:/policies:ro
    healthcheck:
      # The image's own check, more often than its default
      test: ["CMD", "/cerbos", "healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 15
