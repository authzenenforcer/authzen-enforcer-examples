# Keycloak as the AuthZEN Policy Decision Point (PDP) for all examples.
#
#   export DOCUMENT_PORTAL_CLIENT_SECRET=$(openssl rand -hex 24)
#   export EXAMPLE_USER_PASSWORD=$(openssl rand -hex 24)
#   docker compose up --wait
#
# The realm file contains no secrets; Keycloak reads the client secret and the users' password from
# the environment when it imports the realm.
#
# KEYCLOAK_ADDRESS and KEYCLOAK_PORT set where Keycloak is published (default 127.0.0.1:8080). The
# image stays a literal so that Dependabot can update it.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--features=authzen", "--import-realm", "--health-enabled=true"]
    environment:
      DOCUMENT_PORTAL_CLIENT_SECRET: ${DOCUMENT_PORTAL_CLIENT_SECRET:?set DOCUMENT_PORTAL_CLIENT_SECRET}
      EXAMPLE_USER_PASSWORD: ${EXAMPLE_USER_PASSWORD:?set EXAMPLE_USER_PASSWORD}
    ports:
      - "${KEYCLOAK_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/authzen-examples-realm.json:/opt/keycloak/data/import/authzen-examples-realm.json:ro
    healthcheck:
      # The image has no curl; bash talks to the management port directly.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
