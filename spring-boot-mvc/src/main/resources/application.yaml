# The settings that do not depend on the PDP. Those of the PDP are in a profile of their own:
# application-keycloak.yaml, the default, and application-cerbos.yaml, chosen with
# --spring.profiles.active=cerbos. Override any setting on the command line, such as
# --example.realm-url=..., or with environment variables, such as EXAMPLE_REALM_URL=...
server:
  # Keycloak uses 8080
  port: 8081

spring:
  profiles:
    # The PDP when no profile is chosen
    default: keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          # Callers bring access tokens of the Keycloak realm, whichever PDP decides, issued for this
          # API: the realm adds the audience documents-api to the tokens of documents-cli. Tokens of
          # the realm for other clients, such as the PEP's own, are rejected with 401. Keep
          # documents-api free in the realm: Keycloak adds a client's id as audience to tokens that
          # carry that client's roles. Plain HTTP only because Keycloak runs on this machine: an
          # attacker on the path could replace the keys that verify the tokens with their own
          issuer-uri: ${example.realm-url}
          audiences: documents-api

authzen:
  enforcer:
    subject:
      # The policies name users by their username. The default, sub, is a stable id and is the
      # better choice where the PDP knows it
      id-claim: preferred_username
    resource:
      # /documents/{id} becomes {"type": "document", ...}, the type the policies decide about
      singularize: true

management:
  server:
    # Actuator answers on a port of its own, reachable from this machine only, and never on the port
    # of the API. Choose another one with --management.server.port=... or MANAGEMENT_SERVER_PORT.
    # DocumentsApplication refuses to start if it equals server.port or the address is not a loopback address
    port: 9081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      # Only on 127.0.0.1; the details name the state of the breakers and the last metadata refresh
      show-details: always
  health:
    authzen:
      # Opt-in: the state of the client, without a call to the PDP. Not part of liveness or readiness
      enabled: true
  tracing:
    sampling:
      # Every request, so that each one shows up in the log. Spring Boot samples 10% by default, and an
      # application under load keeps a part only
      probability: 1.0
  observations:
    enable:
      # Spring Security records a span for every filter as well; off to keep the traces short
      spring.security: false
  otlp:
    metrics:
      export:
        # No OTLP collector runs here: the metrics stay in Actuator. The spans go to the log; to send
        # them to a collector instead, set management.opentelemetry.tracing.export.otlp.endpoint
        enabled: false

example:
  # The Keycloak realm that issues the callers' tokens, and with the keycloak profile decides too
  realm-url: http://127.0.0.1:8080/realms/authzen-examples
  # The decision check gets user tokens from the public client documents-cli, and the PEP's own
  # token from the confidential client document-portal, whose secret comes from the environment
  # variable DOCUMENT_PORTAL_CLIENT_SECRET
  token-url: ${example.realm-url}/protocol/openid-connect/token
  user-client-id: documents-cli
  pep-client-id: document-portal
  # Whether the PDP decides about documents it was not told about, such as one created after it
  # started. The realm decides only about its resources; the decision check expects its results
  # accordingly
  pdp-decides-new-documents: false
