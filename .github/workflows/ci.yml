name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that a JDK or runner image update that breaks the examples shows up even when no pull
  # request is open
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Maven Central sometimes answers 429 or a short-lived 404 for a file it has. .mvn/maven.config
# makes Maven retry 429 and 503, and Maven runs through mvn-retry.sh, which tries again when a
# download failed: with -U after a 404, and after a longer wait when the 429s did not stop

jobs:
  pdp:
    name: PDP decisions (Keycloak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate the client secret and the users' password
        run: |
          secret=$(openssl rand -hex 24)
          echo "::add-mask::$secret"
          echo "DOCUMENT_PORTAL_CLIENT_SECRET=$secret" >> "$GITHUB_ENV"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "EXAMPLE_USER_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Start Keycloak
        run: docker compose up --wait
      - name: Check the decisions
        run: keycloak/check-decisions.sh
      - name: Keycloak logs
        if: failure()
        run: docker compose logs keycloak
      - name: Stop Keycloak
        if: always()
        run: docker compose down

  examples:
    name: Examples (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Generate the client secret and the users' password
        run: |
          secret=$(openssl rand -hex 24)
          echo "::add-mask::$secret"
          echo "DOCUMENT_PORTAL_CLIENT_SECRET=$secret" >> "$GITHUB_ENV"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "EXAMPLE_USER_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Start Keycloak
        run: docker compose up --wait
      - name: Build
        run: .github/scripts/mvn-retry.sh -B -ntp verify
      - name: Run plain-java
        run: .github/scripts/mvn-retry.sh -B -ntp -q -f plain-java exec:java
      - name: Run the decision check of spring-boot-mvc
        run: spring-boot-mvc/run.sh check
      - name: Run the decision check of spring-boot-webflux
        run: spring-boot-webflux/run.sh check
      - name: Keycloak logs
        if: failure()
        run: docker compose logs keycloak
      - name: Stop Keycloak
        if: always()
        run: docker compose down
