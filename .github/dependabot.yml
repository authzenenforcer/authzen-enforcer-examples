version: 2
updates:
  - package-ecosystem: maven
    # The root pom lists every example as a module
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
  # The images in compose.yaml, Keycloak and Cerbos; CI checks the decisions with every new version
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
